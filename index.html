    // 渲染卡片清單
    function renderCards() {
      const filtered = GLOSSARY_DATA.filter(item => {
        const matchCategory = activeCategory === 'all' || item.category === activeCategory;
        const query = searchQuery.trim().toLowerCase();
        const matchSearch = query === '' || 
          item.title.toLowerCase().includes(query) ||
          item.en.toLowerCase().includes(query) ||
          item.shortDesc.toLowerCase().includes(query) ||
          item.metaphor.toLowerCase().includes(query);
        return matchCategory && matchSearch;
      });

      totalCountEl.textContent = filtered.length;

      if (filtered.length === 0) {
        cardsGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      cardsGrid.innerHTML = filtered.map(item => `
        <div 
          data-id="${item.id}"
          class="term-card group bg-white rounded-2xl p-5 border border-slate-200/90 hover:border-indigo-400 shadow-sm hover:shadow-lg transition-all duration-200 flex flex-col justify-between cursor-pointer transform hover:-translate-y-1"
        >
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="inline-block px-2.5 py-0.5 rounded-md text-[11px] font-semibold ${item.badgeColor}">
                ${item.categoryName}
              </span>
              <div class="w-8 h-8 rounded-full bg-slate-50 group-hover:bg-indigo-50 flex items-center justify-center text-slate-400 group-hover:text-indigo-600 transition-colors">
                <i class="ph-bold ${item.icon} text-lg"></i>
              </div>
            </div>
            
            <h3 class="text-base font-bold text-slate-900 group-hover:text-indigo-600 transition-colors flex items-center">
              ${item.title}
            </h3>
            <p class="text-xs font-mono text-slate-600 font-medium mb-3">${item.en}</p>
            
            <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed">
              ${item.shortDesc}
            </p>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-indigo-600 font-medium group-hover:translate-x-0.5 transition-transform">
            <span>查看圖解與比喻</span>
            <i class="ph-bold ph-arrow-right"></i>
          </div>
        </div>
      `).join('');

      // 重新綁定卡片點擊事件
      document.querySelectorAll('.term-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.getAttribute('data-id');
          openModal(id);
        });
      });
    }

    // 打開 Modal 視窗
    function openModal(id) {
      const item = GLOSSARY_DATA.find(x => x.id === id);
      if (!item) return;

      modalTitle.textContent = item.title;
      modalEn.textContent = item.en;
      modalBadge.textContent = item.categoryName;
      modalBadge.className = `px-2.5 py-1 rounded-md text-xs font-semibold ${item.badgeColor}`;
      modalSummary.textContent = item.shortDesc;
      modalMetaphor.textContent = item.metaphor;

      // 渲染 SVG 圖形
      modalDiagram.innerHTML = generateDiagramSVG(item.svgType);

      // 渲染重點條列
      modalPoints.innerHTML = item.points.map(pt => `<li>${pt}</li>`).join('');

      // 顯示 Modal
      modal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    // 關閉 Modal 視窗
    function closeModal() {
      modal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    // 事件監聽配置
    modalCloseBtn.addEventListener('click', closeModal);
    modalConfirmBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
        closeModal();
      }
    });

    // 搜尋輸入監聽
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    // 類別標籤篩選切換
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.className = 'category-btn px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all bg-slate-100 text-slate-600 hover:bg-slate-200';
        });
        btn.className = 'category-btn px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all bg-indigo-600 text-white shadow-sm';
        activeCategory = btn.getAttribute('data-cat');
        renderCards();
      });
    });

    // 初始化渲染
    window.onload = function() {
      renderCards();
    };
  </script>
</body>
</html>
